# ==============================================================================
# docker-compose.yml — png6-data-cleaning MVP local infrastructure
#
# Docker Compose runs every service locally.
# "One Docker image starts as API, worker, or scheduler."
#
# Stack: Python 3.12, FastAPI, Pydantic v2, SQLAlchemy 2, Alembic; PostgreSQL 16;
# Redis (default — PROPOSED, Valkey unresolved); MinIO; Celery on RabbitMQ;
# Server-Sent Events; Polars, DuckDB, PyArrow; LiteLLM (Ollama/vLLM, provider not locked);
# JWT + Argon2 for MVP auth; React + Vite + Tailwind CSS + TanStack Query.
#
# Level-2 exit gate: "Invoice file goes from upload to validated export without manual steps."
# Output: 22 invoice rows, 313 line items, gross total 154,292 matched.
# Rollback restores the original exactly.
#
# PROPOSED defaults:
# - P1: exception queue + labelled nulls
# - P2: Redis (PROPOSED default cache; Valkey unresolved)
# - P3: 5% loss limit, 50 MB upload, one role per user
#
# Quickstart:
#   1. Copy .env.example to .env and fill placeholders before running `docker compose up`:
#      cp .env.example .env
#   2. Run `docker compose up` to start all services.
#
# TODO: (NOT STARTED) MinIO bucket 'png6-datasets' for immutable originals is
# created by the app on startup. What done looks like: backend service checks
# and creates the 'png6-datasets' bucket via MinIO client on startup if it does
# not already exist.
# ==============================================================================

services:
  # 1. PostgreSQL 16 — system of record: plans, versions, audit events
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-png6}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-png6}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-png6} -d ${POSTGRES_DB:-png6}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Port 5432 internal only — commented out to restrict database access to services on the png6 network
    # ports:
    #   - "5432:5432"
    networks:
      - png6

  # 2. Redis — PROPOSED default (Valkey unresolved); in-memory cache
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - png6

  # 3. RabbitMQ — message broker for Celery background tasks
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI for local dev
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - png6

  # 4. MinIO — S3-compatible storage for immutable originals and cleaned outputs
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniadata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - png6

  # 5. API service — FastAPI backend; "One Docker image starts as API, worker, or scheduler." Same image as worker/scheduler.
  api:
    build: ./backend
    environment:
      MODE: api
    ports:
      - "8000:8000"
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - png6

  # 6. Worker service — Celery worker; same image as api/scheduler
  worker:
    build: ./backend
    environment:
      MODE: worker
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - png6

  # 7. Scheduler service — Celery beat; same image as api/worker
  scheduler:
    build: ./backend
    environment:
      MODE: scheduler
    env_file: [.env]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - png6

  # 8. Frontend — React + Vite + Tailwind CSS + TanStack Query UI
  frontend:
    build: ./frontend
    # Build arg or env VITE_API_URL defaulting to http://localhost:8000 with comment
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - png6

networks:
  png6:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniadata:
