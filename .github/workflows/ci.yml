# CI for every push and pull request (Level 3 plan, workstream E: E1, E2, E4).
# Merges to main must pass: backend, frontend, security, e2e. The image job
# publishes ghcr.io/<owner>/png6-planner:<sha> from main only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-jwt-secret-that-is-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install -e ".[dev]"
      # Correctness rules only (undefined names, syntax). The wider rule set has
      # existing debt; ratchet it in as files are touched.
      - run: uv run ruff check src tests --select F821,F811,E9
      - run: uv run pytest -q
      # C3: the evaluation pass bar (decision.md D5) with the model OFF, so it is
      # deterministic and free. Exits non-zero if quarantine recall, the injection
      # flag rate or rule recall drops, or if any case crashes.
      - name: Evaluation pass bar (C3, model off)
        run: uv run python scripts/evaluate_benchmark.py --fail-under-bar --json evaluation-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: backend/evaluation-report.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build # tsc -b (strict typecheck) + vite build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: bandit (code) + pip-audit (Python deps)
        working-directory: backend
        run: |
          uv venv && uv pip install -e . bandit pip-audit
          uv run bandit -q -r src -ll
          uv run pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (production deps, high and above)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  e2e:
    # The full Docker Compose stack, the HTTP benchmark on the reference file, API
    # fuzzing, and the browser walk-through (upload -> plan -> approve -> export ->
    # rollback).
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      # Before the .env step: generating the Fernet key below uses `uv run`.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          # Model credentials are encrypted at rest with Fernet, and the app
          # refuses the .env.example placeholder (the fuzzer would see a 500 from
          # PUT /api/v1/model-config). Generate a real key for this run only.
          sed -i "s|^FERNET_KEY=.*|FERNET_KEY=$(uv run --with cryptography python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')|" .env
      - name: start the stack
        run: |
          docker compose -f deploy/docker-compose.yml up -d --build \
            postgres redis rabbitmq minio api worker beat frontend
          timeout 300 bash -c 'until curl -sf localhost:8000/api/v1/health/live; do sleep 3; done'
          timeout 300 bash -c 'until curl -sf -o /dev/null localhost:5173; do sleep 3; done'
      - name: HTTP benchmark on the reference file (exit gate)
        run: |
          uv run --with httpx python backend/scripts/benchmark.py \
            data/reference/VendorInvoices_uncleaned.xlsx --json benchmark.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: browser walk-through
        working-directory: frontend
        run: |
          npm ci
          mkdir -p ../walkthrough
          BASE=http://localhost:5173 SHOTS=../walkthrough node scripts/live-walkthrough.mjs | tee ../walkthrough/log.txt
          ! grep -q "STOPPED:" ../walkthrough/log.txt
      # E3: property-based API fuzzing against the running Compose stack. Logs in
      # as the seeded administrator so the fuzzer reaches the authenticated
      # routes, then fails the job on ANY 5xx response. Non-5xx OpenAPI contract
      # findings are reported but not fatal (see scripts/fuzz_api.py for why).
      #
      # Deliberately LAST: fuzzing generates thousands of malformed logins, and
      # the auth lockout (5 failed attempts, 15 minutes) then answers 403 to the
      # walk-through's real login. Both steps are valid; they just cannot share
      # an account in this order. The fuzzer must not leave the stack in a state
      # the walk-through depends on.
      - name: API fuzzing (E3, no 5xx allowed)
        working-directory: backend
        run: |
          uv run --extra dev python scripts/fuzz_api.py \
            --base-url http://localhost:8000 \
            --json fuzz-report.json \
            --max-examples 5 --workers 2
      - if: always()
        run: docker compose -f deploy/docker-compose.yml logs api worker > compose.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            benchmark.json
            backend/fuzz-report.json
            backend/fuzz-report.xml
            walkthrough/
            compose.log

  sso:
    # Level 3 D-2: the stack in AUTH_MODE=oidc with Keycloak (compose profile `sso`).
    # Proves Keycloak tokens are accepted, roles are enforced, password sign-in is
    # refused and demo users must set up MFA (scripts/sso_smoke.py).
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      # Compose interpolates ${KEYCLOAK_ADMIN_PASSWORD} from the shell environment.
      KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin
    steps:
      - uses: actions/checkout@v4
      - name: .env for SSO
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          # OIDC_ISSUER / OIDC_JWKS_URL defaults in .env.example already point at the stack.
          sed -i "s/^AUTH_MODE=.*/AUTH_MODE=oidc/" .env
          grep -E "^(AUTH_MODE|OIDC_ISSUER|OIDC_JWKS_URL)=" .env
      - name: start the stack with Keycloak
        run: |
          docker compose -f deploy/docker-compose.yml --profile sso up -d --build \
            postgres redis rabbitmq minio keycloak api worker beat
          timeout 300 bash -c 'until curl -sf localhost:8000/api/v1/health/live; do sleep 3; done'
          timeout 300 bash -c 'until curl -sf localhost:8080/realms/png6/.well-known/openid-configuration >/dev/null; do sleep 3; done'
      - name: CI-only client and users (password grant; never in the realm file)
        run: |
          kc() { docker compose -f deploy/docker-compose.yml exec -T keycloak /opt/keycloak/bin/kcadm.sh "$@"; }
          kc config credentials --server http://localhost:8080 --realm master --user admin --password "$KEYCLOAK_ADMIN_PASSWORD"
          kc create clients -r png6 -s clientId=png6-ci -s publicClient=true -s directAccessGrantsEnabled=true -s standardFlowEnabled=false
          for spec in "ci-engineer:CiEngineer123!:data_engineer" "ci-viewer:CiViewer1234!:viewer"; do
            IFS=: read -r u pw role <<< "$spec"
            kc create users -r png6 -s username=$u -s enabled=true -s email=$u@example.com -s emailVerified=true -s firstName=Ci -s lastName=User
            kc set-password -r png6 --username $u --new-password "$pw"
            kc add-roles -r png6 --uusername $u --rolename $role
            # CI users skip the default "configure OTP" action (a password grant cannot
            # do MFA); the demo users in the realm file keep it.
            id=$(kc get users -r png6 -q username=$u --fields id --format csv --noquotes)
            kc update users/$id -r png6 -s 'requiredActions=[]'
          done
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: SSO smoke test
        run: uv run --with httpx python backend/scripts/sso_smoke.py
      - if: always()
        run: docker compose -f deploy/docker-compose.yml logs api keycloak > sso.log 2>&1 || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sso
          path: sso.log

  image:
    # One image per commit (api, worker and beat all run it), scanned before publishing.
    runs-on: ubuntu-latest
    needs: [backend, security]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/png6-planner
    steps:
      - uses: actions/checkout@v4
      - name: production compose files are valid (M5)
        run: |
          cp .env.example .env
          IMAGE_TAG=check DOMAIN=example.com docker compose -f deploy/docker-compose.yml \
            -f deploy/docker-compose.prod.yml --profile prod config -q
          bash -n deploy/remote-deploy.sh deploy/public-demo.sh
      - run: docker build -t "$IMAGE:${{ github.sha }}" backend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"

  deploy:
    # Level 3 E5: every green push to main deploys itself; nobody deploys by hand.
    # Off until the VM exists: set repository variables DEPLOY_HOST and DEPLOY_USER and
    # secret DEPLOY_SSH_KEY (docs/DEPLOYMENT.md, "Cloud VM"). deploy/remote-deploy.sh
    # starts the commit, runs a smoke test and rolls back to the previous commit on failure.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_HOST != ''
    needs: [backend, frontend, security, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # the VM pulls the image with this job's token
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Trust-on-first-use; pin the VM's host key in DEPLOY_KNOWN_HOSTS to avoid it.
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi
      - name: log the VM in to GHCR (short-lived job token, sent over stdin)
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/id_deploy "$TARGET" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: deploy, smoke test, roll back on failure
        run: |
          scp -i ~/.ssh/id_deploy deploy/remote-deploy.sh "$TARGET:/tmp/remote-deploy.sh"
          ssh -i ~/.ssh/id_deploy "$TARGET" "bash /tmp/remote-deploy.sh ${{ github.sha }}"

