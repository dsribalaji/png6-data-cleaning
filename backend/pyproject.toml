[project]
name = "planner"
version = "0.1.0"
description = "Agentic Data Cleaning Planner (PNG6) - backend"
requires-python = ">=3.12"
dependencies = [
    "httpx",  # scripts/benchmark.py runs inside the image for the deploy smoke test
    "fastapi>=0.115",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg",
    "aiosqlite",
    "python-multipart>=0.0.9",
    "celery>=5.4",
    "redis",
    "sse-starlette",
    "boto3",
    "polars[rtcompat]",
    "pyarrow",
    "duckdb",
    "fastexcel",
    "openpyxl",
    "rapidfuzz",
    "python-dateutil",
    "litellm",
    "instructor",
    "pyjwt",
    "pwdlib[argon2]",
    "cryptography",
    "slowapi",
    "structlog",
    "opentelemetry-sdk",
    "prometheus-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "testcontainers",
    "hypothesis",
    "schemathesis",
    "factory-boy",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planner"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection system is declarative: Depends(), Query(), File()
# and DI factories like require_roles() in argument defaults are the framework's
# documented pattern, not the mutable-default bug B008 guards against.
"src/planner/**/router.py" = ["B008"]
"src/planner/main.py" = ["B008"]
"src/planner/core/security.py" = ["B008"]
"src/planner/modules/users/public.py" = ["B008"]
