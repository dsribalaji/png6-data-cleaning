# deploy/docker-compose.yml - png6-data-cleaning MVP local infrastructure (Backend.md).
#
# Services: postgres:16, redis:7, rabbitmq:3.13-management, minio,
# api, worker, beat (one backend image), frontend, prometheus, grafana.
#
# Quickstart:
#   cp .env.example .env   (from the repo root)
#   make build && make up
#
# NOTE: Prometheus/Grafana ship with default configs here; the API scrape
# target and dashboards land with /metrics and the observability slice.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-planner}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-planner} -d $${POSTGRES_DB:-planner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # docker.io/minio/minio is no longer published for anonymous pulls; Chainguard ships the same server.
    image: chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniadata:/data

  api:
    build: ../backend
    env_file:
      - ../.env
    # Migrate + seed the demo users (idempotent), then serve.
    command: sh -c "alembic upgrade head && python scripts/seed_demo.py && exec gunicorn planner.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 300 --keep-alive 75"
    volumes:
      - storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: ../backend
    env_file:
      - ../.env
    # Backend.md queue list plus the default queue (outbox relay is beat-scheduled).
    command: celery -A planner.worker.celery_app worker -Q ingest,profile,plan,execute,validate,eval,celery -l info
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  beat:
    build: ../backend
    env_file:
      - ../.env
    command: celery -A planner.worker.celery_app beat -l info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-local}
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-http://localhost:8080/realms/png6}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-png6-web}
    environment:
      # Vite dev proxy: the browser calls /api on :5173, Vite forwards to the api service.
      - VITE_PROXY_TARGET=http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"

  # D-2 (Level 3): Keycloak SSO with required TOTP MFA. Only with `--profile sso`.
  # Imports deploy/keycloak/realm-png6.json (realm png6, client png6-web with PKCE,
  # the four roles, demo users who must set up an authenticator app on first sign-in).
  # Then run the api with AUTH_MODE=oidc (see docs/DEPLOYMENT.md, "SSO + MFA").
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-keycloak}
      # The issuer browsers and tokens see; the api fetches keys via http://keycloak:8080.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  # D-4 (Level 3): OpenBao secret store, dev mode (in-memory, unsealed, root token).
  # Only with `--profile secrets`. Load secrets once:
  #   docker compose -f deploy/docker-compose.yml exec openbao \
  #     bao kv put secret/png6 JWT_SECRET=... FERNET_KEY=... GROQ_API_KEY=...
  # then set BAO_ADDR=http://openbao:8200 and BAO_TOKEN in .env. Dev mode loses data
  # on restart; a real deployment runs OpenBao with storage and unseal keys.
  openbao:
    image: openbao/openbao:latest
    profiles: ["secrets"]
    command: server -dev -dev-root-token-id=${BAO_DEV_ROOT_TOKEN:-dev-only-root-token} -dev-listen-address=0.0.0.0:8200
    cap_add: [IPC_LOCK]
    ports:
      - "8200:8200"

volumes:
  storage:
  pgdata:
  redisdata:
  rabbitdata:
  miniadata:
